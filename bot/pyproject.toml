[project]
name = "ratatoskr-bot"
version = "0.1.0"
description = "Discord companion for Valheim dedicated servers running the Ratatoskr plugin"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6"]

[project.scripts]
ratatoskr-bot = "ratatoskr_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ratatoskr_bot"]
